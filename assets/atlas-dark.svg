<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="ZhiCast pipeline: script → parse → tts → subtitle+overlay → render → MP4">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="170" y1="180" x2="195" y2="180" marker-end="url(#ah-d)"/>
    <line x1="335" y1="180" x2="360" y2="180" marker-end="url(#ah-d)"/>
    <line x1="500" y1="180" x2="525" y2="180" marker-end="url(#ah-d)"/>
    <line x1="665" y1="180" x2="690" y2="180" marker-end="url(#ah-d)"/>
  </g>
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="170" y1="180" x2="193" y2="180" stroke="#8985FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="335" y1="180" x2="358" y2="180" stroke="#2DC79A" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="180" x2="523" y2="180" stroke="#8985FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="665" y1="180" x2="688" y2="180" stroke="#4DA3FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M170,180 L193,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M335,180 L358,180" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M500,180 L523,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M665,180 L688,180" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="30" y="145" width="140" height="70" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#4DA3FF">Markdown</text>
    <text x="100" y="196" text-anchor="middle" font-size="12" fill="#A1A1A8">知识区脚本</text>

    <rect x="195" y="145" width="140" height="70" rx="14" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="265" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">parse</text>
    <text x="265" y="196" text-anchor="middle" font-size="12" fill="#A1A1A8">ZhiScript manifest</text>

    <rect x="360" y="145" width="140" height="70" rx="14" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="430" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#2DC79A">tts 配音</text>
    <text x="430" y="196" text-anchor="middle" font-size="12" fill="#A1A1A8">edge-tts · 词/句时间戳</text>

    <rect x="525" y="145" width="140" height="70" rx="14" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="595" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">字幕+叠层</text>
    <text x="595" y="196" text-anchor="middle" font-size="12" fill="#A1A1A8">安全区 · Pillow 帧</text>

    <rect x="690" y="145" width="140" height="70" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-0.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="760" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#4DA3FF">render</text>
    <text x="760" y="196" text-anchor="middle" font-size="12" fill="#A1A1A8">ffmpeg → 16:9 MP4</text>
  </g>

  <text x="440" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#A1A1A8">parse → tts → subtitle+overlay → render → MP4</text>
  <text x="440" y="300" text-anchor="middle" font-size="11" fill="#6E6E73">单进程 · 同一 pipeline 被 CLI 与 Web 复用 · 字幕由 TTS 时间戳直出（无 forced-alignment）</text>
</svg>
